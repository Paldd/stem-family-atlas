name: Publish STEM Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the complete catalogue and downloads
        run: python3 scripts/build-database.py
      - name: Build the complete Spanish edition
        run: python3 scripts/build-spanish.py
      - name: Verify source, exports and project-relative links
        run: python3 scripts/verify-site.py
      - name: Verify Spanish completeness and unchanged facts
        run: python3 scripts/verify-spanish.py
      - name: Check JavaScript syntax
        run: find dist -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Verify month-only camp announcements without invented dates
        run: node scripts/verify-camp-month-filter.cjs
      - name: Verify editorial camp goals, eligibility gates and shareable filters
        run: node scripts/verify-camp-editorial.cjs
      - name: Verify sibling groups share a sourced venue and exact timetable
        run: node scripts/verify-family-pairing.cjs
      - name: Verify nearby WRO league and qualification history filters
        run: node scripts/verify-nearby-wro.cjs
      - name: Verify required camp costs and optional childcare separately
        run: node scripts/verify-camp-required-costs.cjs
      - name: Verify Asian camp prices, sibling routes and source availability
        run: node scripts/verify-asia-editorial.cjs
      - name: Verify CR and Mexico camp tariffs, deposits and admission conflicts
        run: node scripts/verify-nearby-editorial.cjs
      - name: Verify North America camp budgets, multiweek calendars and eligibility
        run: node scripts/verify-northamerica-editorial.cjs
      - name: Verify the global RECF inventory and independent world routes
        run: node scripts/verify-recf-global.cjs
      - name: Verify ADC ages, local team restrictions, previews and remote events
        run: node scripts/verify-adc-global.cjs
      - name: Record the exact published source revision
        run: python3 scripts/write-release.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the entire site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '600000'
